{% extends "base.html" %}
{% block contenu %}
<h1 class="h4 mb-3">Changer mon mot de passe</h1>
<div class="card" style="max-width: 520px"><div class="card-body">
  <form method="post">{% csrf_token %}
    {% for champ in form %}
    <div class="mb-3">
      <label class="form-label" for="{{ champ.id_for_label }}">{{ champ.label }}</label>
      <input class="form-control{% if champ.errors %} is-invalid{% endif %}" type="password" name="{{ champ.html_name }}" id="{{ champ.id_for_label }}" required>
      {% for e in champ.errors %}<div class="invalid-feedback">{{ e }}</div>{% endfor %}
      {% if champ.help_text %}<div class="form-text">{{ champ.help_text|safe }}</div>{% endif %}
    </div>
    {% endfor %}
    <button class="btn btn-primary">Enregistrer</button>
  </form>
</div></div>
{% endblock %}
